name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# KLUCZOWE: nowy push anuluje poprzedni, jeszcze trwający deploy,
# zamiast czekać w kolejce aż tamten dobije/utknie/wywali timeout.
# To jest dokładnie to, czego brakowało w domyślnym
# "pages build and deployment" (Source: Deploy from a branch).
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

